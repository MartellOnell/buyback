services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buyback
      POSTGRES_PASSWORD: buyback
      POSTGRES_DB: buyback
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyback"]
      interval: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
